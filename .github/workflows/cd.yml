name: CD workflow

on:
  push:
    branches:
      - main

jobs:
  cd:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy
        run: |
          git config --global user.name "Ruben Zubicoa"
          git config --global user.email "rubenzubicoatic@gmail.com"
          npm run deploy

